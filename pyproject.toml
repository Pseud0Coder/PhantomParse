[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomparse"
version = "1.0.0"
description = "Speculative context staging for zero-waste, low-latency LLM input"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pseud0Coder" }]
keywords = ["llm", "ttft", "latency", "nlp", "rag"]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
hotkey = ["pynput>=1.7"]
visuals = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "flake8>=7.0"]

[project.scripts]
phantomparse = "phantomparse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
